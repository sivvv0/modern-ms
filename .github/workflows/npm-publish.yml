name: Publish to npm

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm test || echo "No tests configured"
      
      - name: Build package
        run: pnpm build
      
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-npm:
    name: Publish to npm
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
      
      - name: Download dist artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      
      - name: Install production dependencies only
        run: pnpm install --prod --no-frozen-lockfile || npm install --production
      
      - name: Update version (if manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npm version ${{ github.event.inputs.version }} --no-git-tag-version
          echo "✅ Version updated to $(node -p "require('./package.json').version")"
      
      - name: Get package info
        id: package-info
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> $GITHUB_OUTPUT
          echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
      
      - name: Check if version exists on npm
        run: |
          PACKAGE_NAME="${{ steps.package-info.outputs.name }}"
          PACKAGE_VERSION="${{ steps.package-info.outputs.version }}"
          
          if npm view $PACKAGE_NAME@$PACKAGE_VERSION version &> /dev/null; then
            echo "❌ Version $PACKAGE_VERSION already exists on npm!"
            echo "Please increment the version in package.json"
            exit 1
          else
            echo "✅ Version $PACKAGE_VERSION is new"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Publish to npm
        run: npm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create publish success flag
        run: echo "PUBLISH_SUCCESS=true" >> $GITHUB_ENV
      
      - name: Publish success summary
        if: success()
        run: |
          echo "## ✅ Published Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`${{ steps.package-info.outputs.name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`v${{ steps.package-info.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Published at:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Install it now:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install ${{ steps.package-info.outputs.name }}@${{ steps.package-info.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
      
      - name: Upload publish info
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: publish-info
          path: |
            package.json
            dist/
          retention-days: 7

  # Separate notification job that always runs but doesn't cause failure
  notify-status:
    name: Notify Status
    needs: [test-and-build, publish-npm]
    runs-on: ubuntu-latest
    if: always()
    
    steps:
      - name: Check publish status
        run: |
          if [ "${{ needs.publish-npm.result }}" == "success" ]; then
            echo "STATUS=✅ SUCCESS" >> $GITHUB_ENV
            echo "MESSAGE=Package published successfully to npm!" >> $GITHUB_ENV
          elif [ "${{ needs.publish-npm.result }}" == "skipped" ]; then
            echo "STATUS=⏭️ SKIPPED" >> $GITHUB_ENV
            echo "MESSAGE=Publish was skipped (not on main branch or no version change)" >> $GITHUB_ENV
          else
            echo "STATUS=❌ FAILED" >> $GITHUB_ENV
            echo "MESSAGE=Publish failed. Check the logs above." >> $GITHUB_ENV
          fi
      
      - name: Create status summary
        run: |
          echo "## ${{ env.STATUS }} npm Publish Workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "${{ env.MESSAGE }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Details:" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger:** \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Workflow:** [${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.publish-npm.result }}" != "success" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### 🔧 Troubleshooting:" >> $GITHUB_STEP_SUMMARY
            echo "1. Check NPM_TOKEN is set in repository secrets" >> $GITHUB_STEP_SUMMARY
            echo "2. Verify package version is unique" >> $GITHUB_STEP_SUMMARY
            echo "3. Ensure package name is available on npm" >> $GITHUB_STEP_SUMMARY
            echo "4. Check tests are passing" >> $GITHUB_STEP_SUMMARY
          fi
