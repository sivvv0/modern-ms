name: Publish to npm

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [created]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (patch, minor, major, or specific version)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      - name: Run tests
        run: pnpm test
      
      - name: Build package
        run: pnpm build
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.node-version }}
          path: dist/
          retention-days: 7

  publish-npm:
    name: Publish to npm
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
      
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8
          run_install: false
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist-20.x
          path: dist/
      
      - name: Install production dependencies only
        run: pnpm install --prod --frozen-lockfile
      
      - name: Verify package contents
        run: |
          echo "📦 Package contents:"
          ls -la dist/
          echo "📋 Package.json:"
          cat package.json | grep -E '(name|version|main|exports)'
      
      - name: Check if version already published
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if npm view $PACKAGE_NAME@$PACKAGE_VERSION version &> /dev/null; then
            echo "❌ Version $PACKAGE_VERSION already published!"
            exit 1
          else
            echo "✅ Version $PACKAGE_VERSION is new"
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Publish to npm
        run: npm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      
      - name: Create publish timestamp
        run: |
          echo "PUBLISH_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")" >> $GITHUB_ENV
      
      - name: Save publish info
        run: |
          cat > publish-info.json << EOF
          {
            "package": "$(node -p "require('./package.json').name")",
            "version": "$(node -p "require('./package.json').version")",
            "publishTime": "${{ env.PUBLISH_TIME }}",
            "publisher": "${{ github.actor }}",
            "commit": "${{ github.sha }}"
          }
          EOF
          echo "✅ Published to npm successfully!"

  create-release-notes:
    name: Create Release Notes
    needs: publish-npm
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Get version
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
      
      - name: Generate changelog
        id: changelog
        run: |
          # Get last tag
          LAST_TAG=$(git describe --tags --abbrev=0 @^ 2>/dev/null || echo "")
          
          if [ -z "$LAST_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s" --max-count=50)
          else
            CHANGELOG=$(git log --pretty=format:"- %s" $LAST_TAG..HEAD)
          fi
          
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Save release notes
        run: |
          cat > RELEASE_NOTES.md << EOF
          # modern-ms v${{ steps.get_version.outputs.VERSION }}
          
          ## 📦 Installation
          \`\`\`bash
          npm install modern-ms@${{ steps.get_version.outputs.VERSION }}
          \`\`\`
          
          ## ✨ Changes in this release
          ${{ steps.changelog.outputs.CHANGELOG }}
          
          ## 📚 Documentation
          - [GitHub Repository](https://github.com/${{ github.repository }})
          - [npm Package](https://www.npmjs.com/package/modern-ms)
          
          ## 🙏 Contributors
          ${{ github.actor }}
          
          ---
          *Published on $(date -u +"%Y-%m-%d %H:%M:%S UTC")*
          EOF
          
          echo "✅ Release notes saved to RELEASE_NOTES.md"
      
      - name: Upload release notes
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: RELEASE_NOTES.md
          retention-days: 30

  notify-success:
    name: Success Notification
    needs: publish-npm
    runs-on: ubuntu-latest
    if: success()
    
    steps:
      - name: Get package info
        run: |
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV
      
      - name: Create success summary
        run: |
          echo "## ✅ npm Publish Successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** \`${{ env.PACKAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** \`v${{ env.PACKAGE_VERSION }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Published by:** @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**Published at:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 Install Command" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "npm install ${{ env.PACKAGE_NAME }}@${{ env.PACKAGE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View on npm](https://www.npmjs.com/package/${{ env.PACKAGE_NAME }}/v/${{ env.PACKAGE_VERSION }})" >> $GITHUB_STEP_SUMMARY

  notify-failure:
    name: Failure Notification
    needs: [test-and-build, publish-npm]
    runs-on: ubuntu-latest
    if: failure()
    
    steps:
      - name: Create failure summary
        run: |
          echo "## ❌ npm Publish Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Failed workflow:** \`${{ github.workflow }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Failed job:** \`${{ github.job }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔍 Check the following:" >> $GITHUB_STEP_SUMMARY
          echo "- NPM_TOKEN is set correctly in repository secrets" >> $GITHUB_STEP_SUMMARY
          echo "- Package version is incremented" >> $GITHUB_STEP_SUMMARY
          echo "- Package name is available on npm" >> $GITHUB_STEP_SUMMARY
          echo "- All tests are passing" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🔗 [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY
